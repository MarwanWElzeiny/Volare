<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Volare — Capture Plate</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #191919;
      display: grid;
      place-items: center;
      font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      color: #eee;
    }
    /* Checkerboard shows through where the render is transparent, so you can
       confirm alpha before exporting. Hidden during capture. */
    #stage {
      background-image:
        linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
        linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
        linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      outline: 1px solid #444;
    }
    body.capturing { background: #000; }
    body.capturing #stage { background-image: none; outline: none; }
    body.capturing #hud { display: none; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.82); padding: 12px 14px; border-radius: 10px;
      max-width: 330px; border: 1px solid #333;
    }
    #hud b { color: #fff; }
    #hud code { color: #8fd; }
    #hud kbd {
      background: #333; border-radius: 4px; padding: 1px 6px;
      border: 1px solid #555; font-family: inherit;
    }
    #status { margin-top: 8px; color: #8fd; min-height: 1.4em; }
    #hud .row { margin-top: 6px; color: #aaa; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div id="hud">
    <b>Volare capture plate</b>
    <div class="row"><kbd>R</kbd> record WebM &nbsp; <kbd>P</kbd> PNG sequence</div>
    <div class="row"><kbd>H</kbd> hide this panel &nbsp; <kbd>Space</kbd> pause spin</div>
    <div class="row" id="cfg"></div>
    <div id="status"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js"
      }
    }
  </script>

  <script type="module">
    import { createVolareViewer } from '../../SDK/Core/createVolareViewer.js';

    const q = new URLSearchParams(location.search);
    const cfg = {
      model:  q.get('model') || '../../DEMO/models/Avocado/glTF-Binary/Avocado.glb',
      hdri:   q.get('hdri')  || '../../DEMO/models/HDR/photo_studio_01_4k.hdr',
      bg:     q.get('bg')    || 'transparent',   // transparent | #rrggbb | blurred | current
      w:      +(q.get('w')   || 1920),
      h:      +(q.get('h')   || 1080),
      spin:   +(q.get('spin')|| 8),              // seconds per 360°
      fps:    +(q.get('fps') || 30),
      dpr:    +(q.get('dpr') || 1)               // 1 = exact pixel output
    };

    const stage = document.getElementById('stage');
    stage.style.width  = cfg.w + 'px';
    stage.style.height = cfg.h + 'px';
    // Scale down to fit the screen without changing the render resolution.
    const fit = Math.min(1, (innerWidth - 80) / cfg.w, (innerHeight - 80) / cfg.h);
    if (fit < 1) { stage.style.transform = `scale(${fit})`; stage.style.transformOrigin = 'center'; }

    document.getElementById('cfg').textContent =
      `${cfg.w}×${cfg.h} · ${cfg.fps}fps · ${cfg.spin}s/turn · bg:${cfg.bg}`;
    const status = document.getElementById('status');
    const say = m => { status.textContent = m; };

    const isColor = /^#|^rgb/.test(cfg.bg);
    const sdk = await createVolareViewer({
      container: '#stage',
      model: cfg.model,
      ui: false,                                  // no Volare chrome — you have your own in AE
      renderer: { pixelRatio: cfg.dpr, adaptiveQuality: false },
      environment: {
        hdri: cfg.hdri,
        background: isColor ? 'solid' : cfg.bg,
        backgroundColor: isColor ? cfg.bg : undefined,
        intensity: 1
      }
    });

    const viewer   = sdk.viewer;
    const renderer = viewer.renderer;
    const scene    = viewer.scene;
    const camera   = viewer.camera;
    const canvas   = renderer.domElement;
    const model    = viewer.currentModel;

    viewer.centerCameraOnModel?.();
    const baseY = model ? model.rotation.y : 0;

    // Deterministic rotation: drive the angle from a normalized 0..1 position
    // so one turn is exactly 360°, making every export seamlessly loopable.
    // (The built-in Turntable adds a fixed delta per frame, which drifts with
    // framerate and won't close the loop cleanly.)
    // `t % 1` keeps t=1 bit-identical to t=0 (2π and 0 are the same orientation
    // but differ in floating point), so the loop closes exactly.
    const setTurn = t => { if (model) model.rotation.y = baseY + (t % 1) * Math.PI * 2; };
    const drawNow = () => renderer.render(scene, camera);

    let paused = false, t0 = performance.now();
    (function spin(now) {
      if (!paused) setTurn((((now - t0) / 1000) % cfg.spin) / cfg.spin);
      requestAnimationFrame(spin);
    })(t0);

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // --- WebM (one file; convert in Media Encoder / ffmpeg for AE) ----------
    async function recordWebM() {
      const turns = +(q.get('turns') || 1);
      const ms = cfg.spin * turns * 1000;
      const stream = canvas.captureStream(cfg.fps);
      const type = ['video/webm;codecs=vp9', 'video/webm']
        .find(t => MediaRecorder.isTypeSupported(t));
      const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 40e6 });
      const chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      document.body.classList.add('capturing');
      paused = false; t0 = performance.now();
      rec.start();
      await sleep(ms);
      rec.stop();
      await new Promise(r => rec.onstop = r);
      document.body.classList.remove('capturing');
      save(new Blob(chunks, { type }), `volare-plate-${cfg.w}x${cfg.h}.webm`);
      say('WebM saved. Note: WebM carries no alpha in AE — use PNG for transparency.');
    }

    // --- PNG sequence (true alpha, imports straight into AE) ---------------
    async function recordPNGs() {
      const frames = Math.round(cfg.spin * cfg.fps);
      if (!confirm(`Export ${frames} PNG frames?\n\nAllow multiple automatic downloads when Chrome asks.`)) return;
      document.body.classList.add('capturing');
      paused = true;
      for (let i = 0; i < frames; i++) {
        setTurn(i / frames);          // exact 360° across the sequence
        drawNow();                    // render and grab in the same tick
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        save(blob, `volare_${String(i).padStart(4, '0')}.png`);
        say(`frame ${i + 1}/${frames}`);
        await sleep(60);              // let the download queue drain
      }
      document.body.classList.remove('capturing');
      paused = false; t0 = performance.now();
      say(`Done — ${frames} frames. In AE: File ▸ Import, tick "PNG Sequence".`);
    }

    function save(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }

    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'r') recordWebM();
      if (k === 'p') recordPNGs();
      if (k === 'h') document.getElementById('hud').style.display = 'none';
      if (e.code === 'Space') { e.preventDefault(); paused = !paused; if (!paused) t0 = performance.now(); }
    });

    say('Ready.');
    window.volareCapture = { sdk, viewer, setTurn, drawNow, cfg };
  </script>
</body>
</html>
