<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volare Portfolio Embed Demo</title>
  <link rel="icon" type="image/png" href="./models/Volare.png">
  <link rel="stylesheet" href="./models/VolareTabHeader.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f4f4f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
    }

    .portfolio-page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .portfolio-header {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
    }

    .portfolio-header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .portfolio-header p {
      max-width: 720px;
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.6;
    }

    .viewer-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      align-items: start;
    }

    #portfolio-viewer {
      min-height: 560px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #171717;
      overflow: hidden;
    }

    .portfolio-controls {
      display: grid;
      gap: 12px;
    }

    .portfolio-controls label {
      display: grid;
      gap: 6px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
    }

    .portfolio-controls input,
    .portfolio-controls select,
    .portfolio-controls button {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #191919;
      color: #f4f4f4;
      padding: 10px 12px;
      font: inherit;
    }

    .portfolio-controls button {
      cursor: pointer;
      background: #f4f4f4;
      color: #111;
      border-color: #f4f4f4;
    }

    .model-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .model-card {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #171717;
      color: inherit;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .model-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .model-card span {
      display: block;
      padding: 10px;
      color: rgba(255, 255, 255, 0.8);
    }

    @media (max-width: 860px) {
      .viewer-layout {
        grid-template-columns: 1fr;
      }

      #portfolio-viewer {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main class="portfolio-page">
    <header class="portfolio-header">
      <h1>Product Viewer</h1>
      <p>A standalone Volare embed. This page initializes the viewer like a normal portfolio or product site would.</p>
    </header>

    <section class="viewer-layout" aria-label="Volare portfolio viewer">
      <div id="portfolio-viewer"></div>

      <form class="portfolio-controls" id="portfolio-controls">
        <label>
          Model URL
          <input id="model-url" value="./models/Avocado/glTF-Binary/Avocado.glb">
        </label>

        <label>
          HDRI
          <select id="hdri-url">
            <option value="./models/HDR/lonely_road_afternoon_puresky_4k.hdr">Lonely Road Afternoon</option>
            <option value="./models/HDR/photo_studio_01_4k.hdr">Photo Studio 01</option>
            <option value="">Disabled</option>
          </select>
        </label>

        <label>
          Background
          <select id="background-mode">
            <option value="blurred">Blurred HDRI</option>
            <option value="current">Default</option>
            <option value="transparent">Transparent</option>
            <option value="solid">Solid</option>
            <option value="hdri">HDRI Visible</option>
          </select>
        </label>

        <button type="submit">Load Selection</button>
        <button type="button" id="close-viewer">Close Viewer</button>
        <button type="button" id="open-viewer">Open Viewer</button>
      </form>
    </section>

    <section class="model-list" aria-label="Model thumbnails">
      <button class="model-card" data-model="./models/Avocado/glTF-Binary/Avocado.glb">
        <img src="./models/Duck/screenshot/screenshot.png" alt="Duck preview">
        <span>Duck</span>
      </button>
      <button class="model-card" data-model="./models/Avocado/glTF/Avocado.gltf">
        <img src="./models/Avocado/screenshot/screenshot.jpg" alt="Avocado preview">
        <span>Avocado</span>
      </button>
      <button class="model-card" data-model="./models/BrainStem/glTF/BrainStem.gltf">
        <img src="./models/BrainStem/screenshot/screenshot.gif" alt="Brain Stem preview">
        <span>Brain Stem</span>
      </button>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.webgpu.js"
      }
    }
  </script>

  <script type="module">
    import { createVolareViewer } from '../SDK/Core/createVolareViewer.js';
    import { setHdriBasePath } from '../SDK/Managers/LightingController.js';
    setHdriBasePath('./models/HDR/');

    const modelInput = document.getElementById('model-url');
    const hdriSelect = document.getElementById('hdri-url');
    const backgroundSelect = document.getElementById('background-mode');

    const viewer = await createVolareViewer({
      container: '#portfolio-viewer',
      model: modelInput.value,
      ui: false,
      environment: {
        hdri: hdriSelect.value,
        background: backgroundSelect.value,
        intensity: 1
      }
    });

    async function applySelection(modelUrl = modelInput.value) {
      const hdri = hdriSelect.value || null;
      await viewer.setEnvironment({
        enabled: !!hdri,
        hdri,
        background: backgroundSelect.value,
        intensity: 1
      });
      await viewer.loadModel(modelUrl);
    }

    document.getElementById('portfolio-controls').addEventListener('submit', async (event) => {
      event.preventDefault();
      await applySelection();
    });

    document.querySelectorAll('.model-card').forEach(button => {
      button.addEventListener('click', async () => {
        modelInput.value = button.dataset.model;
        await applySelection(button.dataset.model);
      });
    });

    document.getElementById('close-viewer').addEventListener('click', () => viewer.close());
    document.getElementById('open-viewer').addEventListener('click', () => viewer.open());
    window.volarePortfolioViewer = viewer;
  </script>
</body>
</html>
